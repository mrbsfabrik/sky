name: fetch-flights

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-flights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch aircraft near home
        env:
          LAT: '34.185'
          LON: '-83.924'
          NM: '40'
        run: |
          mkdir -p out
          ok=0
          used=none
          for u in \
            "https://api.adsb.lol/v2/point/$LAT/$LON/$NM" \
            "https://api.airplanes.live/v2/point/$LAT/$LON/$NM" \
            "https://opendata.adsb.fi/api/v2/lat/$LAT/lon/$LON/dist/$NM"; do
            if curl -fsS --max-time 20 -A 'mrbsfabrik-sky/1.0' "$u" -o raw.json \
               && jq -e '(.ac // .aircraft) | type == "array"' raw.json > /dev/null; then
              ok=1
              used=$(echo "$u" | cut -d/ -f3)
              break
            fi
            echo "feed failed: $u"
          done
          now_ms=$(( $(date +%s) * 1000 ))
          if [ "$ok" = 1 ]; then
            jq -c --argjson t "$now_ms" --arg s "$used" \
              '{fetched_ms: $t, source: $s, ac: (.ac // .aircraft)}' raw.json > out/data.json
          else
            echo "{\"fetched_ms\":$now_ms,\"source\":\"none\",\"error\":\"all feeds failed\",\"ac\":[]}" > out/data.json
          fi
          echo "wrote $(wc -c < out/data.json) bytes from $used"

      - name: Look up routes (best effort)
        continue-on-error: true
        run: |
          cd out
          mkdir -p ../routes
          jq -r '.ac[]? | (.flight // empty) | gsub("\\s+$";"")' data.json | grep -E '^[A-Z]{3}[0-9]{1,4}[A-Z]?$' | sort -u > ../calls.txt || true
          xargs -a ../calls.txt -P 8 -I{} sh -c 'curl -fsS --max-time 8 -A "mrbsfabrik-sky/1.0" "https://vrs-standing-data.adsb.lol/routes/$(echo {} | cut -c1-2)/{}.json" -o "../routes/{}.json" 2>/dev/null || rm -f "../routes/{}.json"' || true
          for f in ../routes/*.json; do [ -e "$f" ] || continue; cs=$(basename "$f" .json); jq -c --arg cs "$cs" '{($cs): [._airports[]? | {iata, icao, name, location, lat, lon}]}' "$f"; done | jq -s 'add // {}' > ../routes.json || echo '{}' > ../routes.json
          jq -c --slurpfile r ../routes.json '. + {routes: $r[0]}' data.json > data2.json && mv data2.json data.json

      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "sky-bot"
          git config user.email "sky-bot@users.noreply.github.com"
          git add data.json
          git commit -q -m "data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
